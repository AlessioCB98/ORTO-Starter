tatus:'active',events:[{at:now,msg:'Anomalia rilevata'}]};state.alerts.unshift(a);event(a.id+' · '+msg)}}for(const a of state.alerts)if(a.status!=='resolved'&&!keys.has(a.key)){a.status='resolved';a.resolved=now;a.events.push({at:now,msg:'Condizione ripristinata · risoluzione automatica'});event(a.id+' · risolta automaticamente')}save()}function change(id,field,val){if(!admin())return;const d=dev(id);if(!d)return;d[field]=val;if(field==='open')d.changed=Date.now();event(`${d.name}: ${field} → ${val}`);sync();render()}function commandLight(id){if(!user||user.role==='Ospite')return;const d=dev(id);if(d.offline){alert('Shelly offline: comando non disponibile');return}d.on=!d.on;event(`${user.name}: ${d.name} ${d.on?'alimentata':'non alimentata'} (DEMO)`);save();render()}function login(){const id=$('login-user').value,pin=$('login-pin').value;const u=state.users.find(x=>x.id===id&&x.enabled!==false);if(!u||pin!=='1234'){alert('PIN DEMO non valido o utente disabilitato');return}user=u;page='home';event('Accesso DEMO: '+u.name);render()}function goto(p,z){page=p;if(z)currentZone=z;selectedAlert=null;render();window.scrollTo(0,0)}function header(title){return `<div class="top"><h1>${title}</h1><span class="tag">🧪 DEMO</span></div>`}function badge(t,bad=false){return `<span class="pill ${bad?'red':''}">${esc(t)}</span>`}function layout(content){$('app').innerHTML=`<main class="wrap">${content}</main>${user?`<nav class="nav">${[['home','🏠','Home'],['zones','🐇','Zone'],['alerts','🚨','Avvisi'],['history','📈','Storico'],['menu','☰','Menu']].map(([p,i,n])=>`<button class="${page===p||page==='zone'&&p==='zones'?'active':''}" onclick="goto('${p}')"><span>${i}</span>${n}</button>`).join('')}</nav>`:''}`}function render(){sync();if(!user){layout(`<div class="login"><div class="card"><h1>🌱</h1><h1>ORTO p.g.a.</h1><p class="muted">Controllo allevamento · STARTER</p><p><span class="tag">VERSIONE DEMO V0.3</span></p><label class="field">Utente<select id="login-user">${state.users.filter '],['🚨','Anomalie attive',n]].map(([i,k,v])=>`<div class="subcard"><div class="muted mini">${i} ${k}</div><div class="num">${v}</div></div>`).join('')}</div>${n?`<div class="section">AVVISI</div>${active().slice(0,2).map(alertCard).join('')}<button class="btn secondary" onclick="goto('alerts')">Tutti gli avvisi →</button>`:''}<div class="section">📅 EVENTI</div>${homeEvent()}<div class="section">ZONE</div><div class="grid">${visibleZones().map(z=>`<button class="tile" onclick="goto('zone','${z.id}')"><div class="num">${esc(z.icon)}</div><b>${esc(z.name)}</b></button>`).join('')||'<div class="empty">Nessuna zona attiva</div>'}</div><div class="section">STRUMENTI</div><div class="stack"><button class="btn secondary" onclick="alert('Inseriremo il collegamento alla checklist Google Sheets nelle impostazioni.')">☑️ CHECKLIST GIORNALIERA ↗</button>${admin()?'<button class="btn secondary" onclick="goto(\'demo\')">🧪 MODALITÀ DEMO / TEST</button>':''}</div>`}function zoneView(){const conf=state.zoneConfigs[currentZone];if(!conf||conf.status!=='active')return header('Zona non disponibile')+'<button class="btn secondary" onclick="goto(\'zones\')">Torna alle zone</button>';const z=conf.id,icon=esc(conf.icon),name=esc(conf.name),ds=Object.entries(state.devices).filter(([id,d])=>d.zone===z),sensors=ds.filter(([id,d])=>d.kind==='sensor'),doors=ds.filter(([id,d])=>d.kind==='door'),light=ds.find(([id,d])=>d.kind==='light'),water=ds.filter(([id,d])=>d.kind==='water'),num=active().filter(a=>a.zone===z).length;return header(`${icon} ${name}`)+`<button class="btn secondary small" onclick="goto('zones')">‹ Zone</button><div class="card"><div class="row"><b>STATO GENERALE</b>${badge(num?num+' AVVISI':'REGOLARE',!!num)}</div><div class="grid" style="margin-top:15px"><div class="subcard"><div class="muted mini">🌡️ TEMPERATURA</div><b>${!sensors.length?'—':sensors[0][1].stale?'—':sensors[0][1].temp.toFixed(1)+' °C'}</b></div><div class="subcard"><div class="muted mini">💧 UMIDITÀ</div><b>${!se edia'?'yellow':''} click" onclick="selectedAlert='${a.id}';gotoAlert()"><div class="row"><b>🔴 ${esc(a.zone.toUpperCase())} · ${esc(dev(a.device)?.name||a.device)}</b><span>›</span></div><p>${esc(a.msg)}</p><div class="mini muted">${a.id} · ${date(a.start)} · ${a.status==='ack'?'In carico':'Da prendere in carico'}</div></div>`}function gotoAlert(){page='alerts';render();window.scrollTo(0,0)}function alertsView(){const a=state.alerts.find(x=>x.id===selectedAlert);if(a)return header('🚨 Dettaglio avviso')+`<button class="btn secondary small" onclick="selectedAlert=null;render()">‹ Avvisi</button><div class="alert"><h2>${esc(a.id)} · ${esc(a.msg)}</h2><p>Zona: ${esc(a.zone)}<br>Dispositivo: ${esc(dev(a.device)?.name||a.device)}<br>Gravità: ${esc(a.severity)}<br>Inizio: ${date(a.start)}<br>Stato: ${a.status==='resolved'?'Risolta':a.status==='ack'?'In carico':'Attiva'}${a.by?'<br>In carico: '+esc(a.by)+' · '+date(a.ackAt):''}${a.resolved?'<br>Risolta: '+date(a.resolved):''}</p><div class="actions">${a.status==='active'&&user.role!=='Ospite'?`<button class="btn" onclick="ack('${a.id}')">Prendi in carico</button>`:''}<button class="btn secondary" onclick="sync();render()">Verifica risoluzione</button>${admin()&&a.status==='resolved'&&!a.archived?`<button class="btn secondary" onclick="archiveAlert('${a.id}')">Chiudi avviso</button>`:''}${admin()&&a.status!=='resolved'&&!a.archived?`<button class="btn danger" onclick="archiveAlert('${a.id}')">Chiusura amministrativa</button>`:''}</div></div><div class="section">CRONOLOGIA</div>${a.events.map(e=>`<div class="card mini">${date(e.at)} · ${esc(e.msg)}</div>`).join('')}`;return header('🚨 AVVISI')+`<div class="card row"><b>${active().length} anomalie attive</b>${badge('DEMO')}</div>${active().length?active().map(alertCard).join(''):'<div class="empty">✅ Nessuna anomalia attiva</div>'}<div class="section">RISOLTE / ARCHIVIATE</div>${state.alerts.filter(a=>a.status==='resolved'||a.archived).slice(0,25).map(a=>`<div class="card click" onclick="selectedAlert='${a.id}';render()"><b>${esc(a.id)} · ${esc(a.msg)}</b><div class="muted mini">${date(a.start)} · ${a.archived?'Archiviata':'Risolta'}</div></div>`).join('')||'<div class="muted">Nessuna</div>'}`}function ack(id){const a=state.alerts.find(x=>x.id===id);if(!a||a.status!=='active'||user.role==='Ospite')return;a.status='ack';a.by=user.name;a.ackAt=Date.now();a.events.push({at:Date.now(),msg:'Presa in carico da '+user.name});event(id+' preso in carico');save();render()}function archiveAlert(id){if(!admin())return;const a=state.alerts.find(x=>x.id===id);if(!a)return;let reason='';if(a.status!=='resolved'){reason=prompt('Motivazione obbligatoria della chiusura amministrativa (il guasto rimarrà attivo):')||'';if(!reason.trim())return}a.archived=true;a.events.push({at:Date.now(),msg:'Archiviato da '+user.name+(reason?' · '+reason:'')});event(id+' archiviato');save();render()}function historyView(){const d=dev(chartSensor)||Object.values(state.devices).find(d=>d.kind==='sensor');let points=Array.from({length:30},(_,i)=>({x:i,y:d.temp+Math.sin(i*.55)*.7+Math.cos(i*.24)*.4}));const poly=points.map((p,i)=>`${i*10},${110-(p.y-14)*9}`).join(' ');return header('📈 STORICO')+`<div class="banner">Grafici dimostrativi generati localmente; non sono misure storiche reali.</div><div class="card"><label class="field">Sensore<select onchange="chartSensor=this.value;render()">${Object.entries(state.devices).filter(([id,d])=>d.kind==='sensor'&&state.zoneConfigs[d.zone]?.status==='active').map(([id,d])=>`<option value="${id}" ${id===chartSensor?'selected':''}>${esc(zoneName(d.zone))} · ${esc(d.name)}</option>`).join('')}</select></label><svg viewBox="0 0 300 130" preserveAspectRatio="none" aria-label="Grafico simulato"><path d="M0 115 H300" stroke="#485249"/><polyline points="${poly}" stroke="#38c86d" stroke-width="3" fill="none"/></svg><div class="muted mini">Andamento dimostrativo · °C</div></div><div class="section">EVENTI DELLA DEMO</div>${state.events.slice(0,60).map(e=>`<div class="card mini">${date(e.at)} · ${esc(e.msg)}</div>`).join('')||'<div class="empty">Nessun evento</div>'}`}function menuView(){return header('☰ MENU')+`<div class="stack"><div class="card"><b>${esc(user.name)}</b><div class="muted">${esc(user.role)}</div><button class="btn secondary small" style="margin-top:12px" onclick="user=null;page='home';render()">Esci</button></div><button class="btn secondary" onclick="goto('diagnostics')">🖥️ Visualizza dettagli tecnici</button><button class="btn secondary" onclick="goto('calendar')">📅 Eventi</button>${admin()?'<button class="btn secondary" onclick="goto(\'zoneadmin\')">🗺️ Gestione zone</button><button class="btn secondary" onclick="goto(\'settings\')">⚙️ Personalizzazione e impostazioni</button><button class="btn secondary" onclick="goto(\'demo\')">🧪 Simulatore DEMO / TEST</button>':''}</div>`}function diagnosticsView(){return header('🖥️ DIAGNOSTICA')+`<div class="banner">Valori dimostrativi: nessuna diagnostica hardware collegata.</div>${['Brain-01','ORTO API','MQTT','Companion','SQLite','Controller ESP32','Shelly','Telecamere','Backup','Rete locale','Internet'].map(n=>`<div class="card row"><b>${n}</b><span class="pill yellow">NON COLLEGATO</span></div>`).join('')}`}function demoView(){if(!admin())return header('Accesso non autorizzato');return header('🧪 DEMO / TEST')+`<div class="banner"><b>MODALITÀ DI SIMULAZIONE</b><p class="mini">Modifica sensori e stati. Le anomalie si aggiornano automaticamente. Nessun comando raggiunge dispositivi reali.</p></div><button class="btn danger" style="width:100%" onclick="resetDemo()">↻ RESET TUTTI I TEST</button><div class="section">SISTEMA</div>${Object.keys(state.issues).map(k=>`<div class="card row"><b>${({brain:'Brain-01',network:'Rete',backup:'Backup'})[k]}</b><button class="btn small ${state.issues[k]?'danger':'secondary'}" onclick="state.issues['${k}']=!state.issues['${k}'];event('Test ${k}');sync();render()">${state.issues[k]?'GUASTO':'NORMALE'}</button></div>`).join('')}${visibleZones().map(({id:z,icon,name})=>`<div class="section">${esc(icon)} ${esc(name)}</div>${Object.entries(state.devices).filter(([id,d])=>d.zone===z).map(([id,d])=>`<div class="card"><div class="row"><b>${esc(d.name)}</b><span class="muted mini">${d.kind.toUpperCase()}</span></div>${d.kind==='door'?`<div class="actions"><button class="btn small ${d.open?'danger':'secondary'}" onclick="change('${id}','open',${!d.open})">${d.open?'APERTO · Chiudi':'CHIUSO · Apri'}</button></div>`:d.kind==='sensor'?`<div class="grid"><label class="field mini">Temperatura °C<input type="number" step="0.5" value="${d.temp}" onchange="change('${id}','temp',Number(this.value))"></label><label class="field mini">Umidità %<input type="number" min="0" max="100" value="${d.hum}" onchange="change('${id}','hum',Number(this.value))"></label></div><button class="btn secondary small" onclick="change('${id}','stale',${!d.stale})">${d.stale?'Ripristina aggiornamenti':'Simula sensore fermo'}</button>`:d.kind==='light'?`<div class="actions"><button class="btn secondary small" onclick="change('${id}','on',${!d.on})">Linea ${d.on?'alimentata':'non alimentata'}</button><button class="btn small ${d.offline?'danger':'secondary'}" onclick="change('${id}','offline',${!d.offline})">Shelly ${d.offline?'OFFLINE':'ONLINE'}</button></div>`:d.kind==='water'?`<button class="btn small ${d.low?'danger':'secondary'}" onclick="change('${id}','low',${!d.low})">${d.low?'LIVELLO BASSO':'LIVELLO SUFFICIENTE'}</button>`:''}</div>`).join('')}`).join('')}`}function resetDemo(){if(!confirm('Ripristinare tutti gli stati simulati? Le zone, gli eventi programmati e i nomi personalizzati saranno conservati.'))return;const preserved={users:state.users,zoneConfigs:state.zoneConfigs,calendar:state.calendar};const oldDevices=state.devices;state=defaults();state.users=preserved.users;state.zoneConfigs=preserved.zoneConfigs;state.calendar=preserved.calendar;for(const [id,d] of Object.entries(state.devices))if(oldDevices[id]?.name)d.name=oldDevices[id].name;event('Reset DEMO eseguito');save();render()}function settingsView(){if(!admin())return header('Accesso non autorizzato');return header('⚙️ PERSONALIZZAZIONE')+`<div class="banner">Le modifiche sono salvate soltanto in questo browser. La DEMO pubblica non dispone di autenticazione sicura.</div><button class="btn secondary" onclick="goto('zoneadmin')">🗺️ Gestione zone</button><div class="section">UTENTI</div>${state.users.map(u=>`<div class="card"><label class="field">${u.role} · ${u.id}<input id="name-${u.id}" value="${esc(u.name)}"></label>${u.id==='guest'?`<label class="switch"><input type="checkbox" id="guest-enabled" ${u.enabled?'checked':''}> Ospite abilitato (solo lettura)</label>`:''}</div>`).join('')}<div class="section">DISPOSITIVI</div>${visibleZones().map(({id:z,icon,name})=>`<div class="section">${esc(icon)} ${esc(name)}</div>${Object.entries(state.devices).filter(([id,d])=>d.zone===z).map(([id,d])=>`<label class="field mini">${id}<input data-device="${id}" value="${esc(d.name)}"></label>`).join('')}`).join('')}<label class="field">Ritardo avviso sportello aperto (secondi)<input type="number" min="1" id="door-delay" value="${state.settings.doorDelay}"></label><button class="btn" onclick="saveSettings()">💾 SALVA MODIFICHE</button>`}function saveSettings(){if(!admin())return;for(const u of state.users){const v=$('name-'+u.id)?.value.trim();if(v)u.name=v}const g=$('guest-enabled');if(g)state.users.find(u=>u.id==='guest').enabled=g.checked;document.querySelectorAll('[data-device]').forEach(el=>{if(el.value.trim())dev(el.dataset.device).name=el.value.trim()});state.settings.doorDelay=Math.max(1,Number($('door-delay').value)||30);user=state.users.find(u=>u.id===user.id);event('Personalizzazione aggiornata da '+user.name);save();alert('Modifiche DEMO salvate in questo browser');render()}
// ZONE DINAMICHE: nomi/identificatori separati; non cancelliamo dati hardware o storico.
function zoneAdminView(){if(!admin())return header('Accesso non autorizzato');return header('🗺️ GESTIONE ZONE')+`<div class="banner">DEMO · Le zone sospese o archiviate sono nascoste dall'operatività. I dispositivi e lo storico restano memorizzati. Nessun hardware reale è collegato.</div><div class="stack">${zoneList().map(z=>`<div class="card"><div class="row"><b>${esc(z.icon)} ${esc(z.name)}</b><span class="pill ${z.status==='active'?'':'yellow'}">${esc(({active:'ATTIVA',preparation:'IN PREPARAZIONE',paused:'SOSPESA',archived:'ARCHIVIATA'})[z.status]||z.status)}</span></div><div class="muted mini">ID permanente: ${esc(z.id)} · ${Object.values(state.devices).filter(d=>d.zone===z.id).length} dispositivi</div><div class="actions"><button class="btn secondary small" onclick="editZone('${z.id}')">Modifica</button>${z.status!=='active'?`<button class="btn small" onclick="setZoneStatus('${z.id}','active')">Attiva</button>`:''}${z.status!=='paused'?`<button class="btn secondary small" onclick="setZoneStatus('${z.id}','paused')">Sospendi</button>`:''}${z.status!=='archived'?`<button class="btn secondary small" onclick="setZoneStatus('${z.id}','archived')">Archivia</button>`:''}</div></div>`).join('')}</div><div class="section">NUOVA ZONA</div><div class="card"><label class="field">Nome<input id="new-zone-name" maxlength="45" placeholder="Es. API, PICCIONI, SERRA"></label><label class="field">Icona / emoji<input id="new-zone-icon" maxlength="8" value="🌱"></label><label class="field">Stato iniziale<select id="new-zone-status"><option value="preparation">In preparazione (nascosta)</option><option value="active">Attiva (visibile)</option></select></label><button class="btn" onclick="createZone()">＋ Crea zona</button><p class="muted mini">Le nuove zone nascono senza dispositivi. Potrai associare sensori e attuatori quando predisporremo la configurazione hardware.</p></div>`}
function createZone(){if(!admin())return;const name=$('new-zone-name').value.trim(),icon=$('new-zone-icon').value.trim()||'📍',status=$('new-zone-status').value;if(!name){alert('Inserisci il nome della zona');return}const id='zone-'+(++state.seq);state.zoneConfigs[id]={id,name,icon,status,type:'custom',created:Date.now()};event('Zona creata: '+name);save();render()}
function editZone(id){if(!admin())return;const z=state.zoneConfigs[id];if(!z)return;const name=prompt('Nome visualizzato della zona:',z.name);if(name===null)return;if(!name.trim()){alert('Il nome non può essere vuoto');return}const icon=prompt('Icona / emoji:',z.icon);if(icon===null)return;z.name=name.trim().slice(0,45);z.icon=icon.trim().slice(0,8)||'📍';event('Zona rinominata: '+z.name);save();render()}
function setZoneStatus(id,status){if(!admin()||!['active','paused','archived','preparation'].includes(status))return;const z=state.zoneConfigs[id];if(!z)return;if(status==='archived'&&!confirm('Archiviare '+z.name+'? La zona sparirà dalla Home, ma i dati resteranno conservati.'))return;z.status=status;event('Zona '+z.name+': '+status);save();sync();render()}
// EVENTI PROGRAMMATI: distinti dal registro tecnico state.events.
let editingEvent=null;
const upcomingEvents=()=>state.calendar.filter(e=>!e.deleted&&!e.done).slice().sort((a,b)=>Date.parse(a.start)-Date.parse(b.start));
function homeEvent(){const now=Date.now(),events=upcomingEvents(),current=events.find(e=>Date.parse(e.start)<=now&&(!e.end||Date.parse(e.end)>=now)),next=current||events.find(e=>Date.parse(e.start)>=now),label=next?(current?'IN CORSO':'PROSSIMO EVENTO'):'NESSUN EVENTO PROGRAMMATO';return `<div class="card click" onclick="goto('calendar')"><div class="row"><div><div class="muted mini">${label}</div><b>${next?esc(next.title):'📅 Apri il calendario eventi'}</b>${next?`<div class="muted mini">${dateTimeEvent(next.start,next.allDay)}${next.zone?' · '+esc(zoneName(next.zone)):''}</div>`:''}</div><span style="font-size:24px">›</span></div></div>`}
function dateTimeEvent(s,allDay){const d=new Date(s);if(isNaN(d))return 'Data non valida';return d.toLocaleDateString('it-IT',{day:'2-digit',month:'2-digit',year:'numeric'})+(allDay?' · Tutto il giorno':' · '+d.toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'}))}
function calendarView(){const now=Date.now(),events=state.calendar.filter(e=>!e.deleted).slice().sort((a,b)=>Date.parse(a.start)-Date.parse(b.start));return header('📅 EVENTI')+`<div class="row"><span class="muted mini">Calendario dell'allevamento · DEMO</span>${admin()?'<button class="btn small" onclick="editingEvent=null;goto(\'eventedit\')">＋ Nuovo evento</button>':''}</div>${events.length?events.map(e=>{const past=Date.parse(e.end||e.start)<now,ongoing=Date.parse(e.start)<=now&&e.end&&Date.parse(e.end)>=now;return `<div class="card"><div class="row"><b>${esc(e.title)}</b><span class="pill ${e.done?'yellow':''}">${e.done?'COMPLETATO':ongoing?'IN CORSO':past?'PASSATO':'PROGRAMMATO'}</span></div><div class="muted mini">${dateTimeEvent(e.start,e.allDay)}${e.end?' → '+dateTimeEvent(e.end,e.allDay):''}${e.zone?' · '+esc(zoneIcon(e.zone)+' '+zoneName(e.zone)):''}</div>${e.description?`<p>${esc(e.description)}</p>`:''}${admin()?`<div class="actions"><button class="btn secondary small" onclick="editingEvent='${e.id}';goto('eventedit')">Modifica</button><button class="btn secondary small" onclick="toggleEventDone('${e.id}')">${e.done?'Riapri':'Completa'}</button><button class="btn danger small" onclick="deleteEvent('${e.id}')">Elimina</button></div>`:''}</div>`}).join(''):'<div class="empty">Nessun evento inserito</div>'}<div class="card muted mini">Gli eventi sono salvati in questo browser; non sono ancora condivisi tra dispositivi. Nessuna notifica reale viene inviata.</div>`}
function eventEditView(){if(!admin())return header('Accesso non autorizzato');const e=state.calendar.find(x=>x.id===editingEvent),now=new Date(),localDate=new Date(now.getTime()-now.getTimezoneOffset()*60000).toISOString().slice(0,16);return header(e?'✏️ MODIFICA EVENTO':'＋ NUOVO EVENTO')+`<button class="btn secondary small" onclick="goto('calendar')">‹ Eventi</button><div class="card"><label class="field">Titolo<input id="ev-title" maxlength="100" value="${esc(e?.title||'')}" placeholder="Es. Parto coniglia G3"></label><label class="field">Descrizione (facoltativa)<textarea id="ev-desc" rows="3" maxlength="1000">${esc(e?.description||'')}</textarea></label><label class="field">Inizio<input id="ev-start" type="datetime-local" value="${esc(e?.start||localDate)}"></label><label class="field">Fine (facoltativa)<input id="ev-end" type="datetime-local" value="${esc(e?.end||'')}"></label><label class="switch"><input id="ev-allday" type="checkbox" ${e?.allDay?'checked':''}> Tutto il giorno</label><label class="field">Zona associata (facoltativa)<select id="ev-zone"><option value="">Nessuna zona</option>${zoneList().map(z=>`<option value="${esc(z.id)}" ${e?.zone===z.id?'selected':''}>${esc(z.icon+' '+z.name)}</option>`).join('')}</select></label><button class="btn" onclick="saveCalendarEvent()">💾 Salva evento</button></div>`}
function saveCalendarEvent(){if(!admin())return;const title=$('ev-title').value.trim(),start=$('ev-start').value,end=$('ev-end').value;if(!title||!start){alert('Titolo e data di inizio sono obbligatori');return}if(end&&Date.parse(end)<Date.parse(start)){alert('La fine non può precedere l’inizio');return}let e=state.calendar.find(x=>x.id===editingEvent);if(!e){e={id:'EV-'+(++state.seq),done:false};state.calendar.push(e)}Object.assign(e,{title,description:$('ev-desc').value.trim(),start,end,allDay:$('ev-allday').checked,zone:$('ev-zone').value});event('Evento salvato: '+title);save();editingEvent=null;goto('calendar')}
function toggleEventDone(id){if(!admin())return;const e=state.calendar.find(x=>x.id===id);if(!e)return;e.done=!e.done;event('Evento '+e.title+': '+(e.done?'completato':'riaperto'));save();render()}
function deleteEvent(id){if(!admin())return;const e=state.calendar.find(x=>x.id===id);if(!e||!confirm('Eliminare l’evento '+e.title+'?'))return;e.deleted=true;event('Evento eliminato: '+e.title);save();render()}

setInterval(()=>{if(user){sync();if(page==='home'||page==='alerts'||page==='zone')render()}},5000);render();
</script></body></html>
