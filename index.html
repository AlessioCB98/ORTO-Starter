function calendarView(){const now=Date.now(),events=state.calendar.filter(e=>!e.deleted).slice().sort((a,b)=>Date.parse(a.start)-Date.parse(b.start));return header('📅 EVENTI')+`<div class="row"><span class="muted mini">Calendario dell'allevamento · DEMO</span>${admin()?'<button class="btn small" onclick="editingEvent=null;goto(\'eventedit\')">＋ Nuovo evento</button>':''}</div>${events.length?events.map(e=>{const past=Date.parse(e.end||e.start)<now,ongoing=Date.parse(e.start)<=now&&e.end&&Date.parse(e.end)>=now;return `<div class="card"><div class="row"><b>${esc(e.title)}</b><span class="pill ${e.done?'yellow':''}">${e.done?'COMPLETATO':ongoing?'IN CORSO':past?'PASSATO':'PROGRAMMATO'}</span></div><div class="muted mini">${dateTimeEvent(e.start,e.allDay)}${e.end?' → '+dateTimeEvent(e.end,e.allDay):''}${e.zone?' · '+esc((state.zoneConfigs[e.zone]?.icon||'📍')+' '+zoneName(e.zone)):''}</div>${e.description?`<p>${esc(e.description)}</p>`:''}${admin()?`<div class="actions"><button class="btn secondary small" onclick="editingEvent='${e.id}';goto('eventedit')">Modifica</button><button class="btn secondary small" onclick="toggleEventDone('${e.id}')">${e.done?'Riapri':'Completa'}</button><button class="btn danger small" onclick="deleteEvent('${e.id}')">Elimina</button></div>`:''}</div>`}).join(''):'<div class="empty">Nessun evento inserito</div>'}<div class="card muted mini">Gli eventi sono salvati in questo browser; non sono ancora condivisi tra dispositivi. Nessuna notifica reale viene inviata.</div>`}
function eventEditView(){if(!admin())return header('Accesso non autorizzato');const e=state.calendar.find(x=>x.id===editingEvent),now=new Date(),localDate=new Date(now.getTime()-now.getTimezoneOffset()*60000).toISOString().slice(0,16);return header(e?'✏️ MODIFICA EVENTO':'＋ NUOVO EVENTO')+`<button class="btn secondary small" onclick="goto('calendar')">‹ Eventi</button><div class="card"><label class="field">Titolo<input id="ev-title" maxlength="100" value="${esc(e?.title||'')}" placeholder="Es. Parto coniglia G3"></label><label class="field">Descrizione (facoltativa)<textarea id="ev-desc" rows="3" maxlength="1000">${esc(e?.description||'')}</textarea></label><label class="field">Inizio<input id="ev-start" type="datetime-local" value="${esc(e?.start||localDate)}"></label><label class="field">Fine (facoltativa)<input id="ev-end" type="datetime-local" value="${esc(e?.end||'')}"></label><label class="switch"><input id="ev-allday" type="checkbox" ${e?.allDay?'checked':''}> Tutto il giorno</label><label class="field">Zona associata (facoltativa)<select id="ev-zone"><option value="">Nessuna zona</option>${zoneList().map(z=>`<option value="${esc(z.id)}" ${e?.zone===z.id?'selected':''}>${esc(z.icon+' '+z.name)}</option>`).join('')}</select></label><button class="btn" onclick="saveCalendarEvent()">💾 Salva evento</button></div>`}
function saveCalendarEvent(){if(!admin())return;const title=$('ev-title').value.trim(),start=$('ev-start').value,end=$('ev-end').value;if(!title||!start){alert('Titolo e data di inizio sono obbligatori');return}if(end&&Date.parse(end)<Date.parse(start)){alert('La fine non può precedere l’inizio');return}let e=state.calendar.find(x=>x.id===editingEvent);if(!e){e={id:'EV-'+(++state.seq),done:false};state.calendar.push(e)}Object.assign(e,{title,description:$('ev-desc').value.trim(),start,end,allDay:$('ev-allday').checked,zone:$('ev-zone').value});event('Evento salvato: '+title);save();editingEvent=null;goto('calendar')}

const V04_DEFAULT_PERMS={lights:true,ack:true,cameras:true};
function migrate04(){for(const u of state.users){if(u.id==='admin'){u.role='Amministratore';u.enabled=true}if(!u.permissions)u.permissions={lights:u.role!=='Ospite',ack:u.role!=='Ospite',cameras:true}}for(const [id,d] of Object.entries(state.devices)){if(d.enabled===undefined)d.enabled=true;if(d.kind==='door'){if(d.delay===undefined)d.delay=state.settings?.doorDelay||30;if(d.changed===undefined)d.changed=Date.now()}if(d.kind==='sensor'){d.tMin??=5;d.tMax??=30;d.hMin??=30;d.hMax??=80;d.confirmSeconds??=30;d.confirmStart??={};}}if(!state.settings)state.settings={doorDelay:30};if(!state.migrated04){const b=state.zoneConfigs.baracca;if(b&&b.name==='BARACCA')b.name='CASETTA';state.migrated04=true}save()}

const activeDevices=(kind,z)=>Object.entries(state.devices).filter(([id,d])=>enabledDev(d)&&(!kind||d.kind===kind)&&(!z||d.zone===z));

function sensorIssues(d){let out=[];if(d.stale)out.push('Non aggiornato');if(!Number.isFinite(d.temp)||!Number.isFinite(d.hum))out.push('Dati assenti');if(Number.isFinite(d.temp)&&(d.temp<d.tMin||d.temp>d.tMax))out.push('Temperatura fuori soglia');if(Number.isFinite(d.hum)&&(d.hum<d.hMin||d.hum>d.hMax))out.push('Umidità fuori soglia');return out}
function sensorStatus(){const ds=activeDevices('sensor');if(!ds.length)return ['—','Nessuno attivo','yellow'];const problems=ds.filter(([id,d])=>sensorIssues(d).length);return problems.length?['ATTENZIONE',problems.length+' / '+ds.length,'red']:['OK',ds.length+' regolari','']}
function sync041(){const now=Date.now(),conditions=[];for(const [id,d] of Object.entries(state.devices)){if(!enabledDev(d))continue;if(d.kind==='door'&&d.open&&now-d.changed>=Math.max(1,Number(d.delay)||30)*1000)conditions.push([id,'Porta aperta oltre il tempo previsto','Alta']);if(d.kind==='sensor'){if(d.stale)conditions.push([id,'Sensore non aggiornato','Media']);for(const [k,bad,msg,severity] of [['temp',d.temp<d.tMin||d.temp>d.tMax,'Temperatura fuori soglia','Alta'],['hum',d.hum<d.hMin||d.hum>d.hMax,'Umidità fuori soglia','Media']]){d.confirmStart??={};if(bad&&!d.stale){d.confirmStart[k]??=now;if(now-d.confirmStart[k]>=Math.max(0,Number(d.confirmSeconds)||0)*1000)conditions.push([id,msg,severity])}else delete d.confirmStart[k]}}if(d.kind==='water'&&d.low)conditions.push([id,'Livello acqua basso','Alta']);if(d.kind==='light'&&d.offline)conditions.push([id,'Shelly offline','Alta']);if(d.kind==='camera'&&d.offline)conditions.push([id,'Telecamera offline','Media'])}for(const [id,on] of Object.entries(state.issues))if(on)conditions.push(['sys-'+id,({brain:'Brain-01 offline',network:'Rete non disponibile',backup:'Backup non riuscito'})[id],'Alta']);const keys=new Set(conditions.map(([id,msg])=>id+'|'+msg));for(const [id,msg,severity] of conditions){let a=state.alerts.find(a=>a.key===id+'|'+msg&&a.status!=='resolved'&&!a.archived);if(!a){a={id:'ALT-'+String(++state.seq).padStart(4,'0'),key:id+'|'+msg,device:id,zone:dev(id)?.zone||'sistema',msg,severity,start:now,status:'active',events:[{at:now,msg:'Anomalia rilevata'}]};state.alerts.unshift(a);event(a.id+' · '+msg)}}for(const a of state.alerts)if(a.status!=='resolved'&&!a.archived&&!keys.has(a.key)){a.status='resolved';a.resolved=now;a.events.push({at:now,msg:'Condizione non più rilevata · risoluzione automatica'});event(a.id+' · risolta automaticamente')}save()}
function home(){const n=active().length,doors=activeDevices('door'),lights=activeDevices('light'),ss=sensorStatus(),house=visibleZones().find(z=>z.id==='baracca'),others=visibleZones().filter(z=>z.id!=='baracca');const tile=z=>`<button class="zone-mini" onclick="goto('zone',${jsarg(z.id)})"><span>${esc(z.icon)}</span><b>${esc(z.name)}</b></button>`;return header('🌱 ORTO p.g.a.')+`<div class="banner">🧪 SIMULAZIONE ATTIVA · Nessun dispositivo reale collegato</div><div class="card row compact-status"><div><b>STATO GENERALE</b><div class="muted mini">${esc(user.name)} · ${esc(user.role)}</div></div>${badge(state.issues.brain?'SISTEMA NON DISPONIBILE':'SISTEMA DEMO ONLINE',!!state.issues.brain)}</div>${n?`<button class="alert-strip" onclick="goto('alerts')"><b>🚨 ANOMALIE</b><span>${n} attive ›</span></button>`:''}<div class="home-metrics"><button class="metric" onclick="goto('overview','door')"><small>🚪 Porte</small><b>${doors.filter(([id,d])=>d.open).length}/${doors.length}</b><span>Aperte</span></button><button class="metric" onclick="goto('overview','light')"><small>💡 Linee Luci</small><b>${lights.filter(([id,d])=>d.on).length}/${lights.length}</b><span>Attive</span></button><button class="metric" onclick="goto('overview','sensor')"><small>🌡️ Sensori</small><b class="${ss[2]}">${ss[0]}</b><span>${ss[1]}</span></button></div><div class="section">📅 EVENTI</div>${homeEvent()}<div class="section">ZONE</div>${house?`<div class="house-zone">${tile(house)}</div>`:''}<div class="zones-three">${others.map(tile).join('')}</div>${!house&&!others.length?'<div class="empty">Nessuna zona attiva</div>':''}<div class="section">STRUMENTI</div><div class="stack"><button class="btn secondary" onclick="goto('cameras')">📷 TELECAMERE — Visualizza tutte</button><button class="btn secondary" onclick="alert('Collegamento checklist Google Sheets ancora da configurare.')">☑️ CHECKLIST GIORNALIERA ↗</button>${admin()?'<button class="btn secondary" onclick="goto(\'demo\')">🧪 MODALITÀ DEMO / TEST</button>':''}</div>`}
function overviewView(){const kind=['door','light','sensor'].includes(currentZone)?currentZone:'door',labels={door:'🚪 PORTE',light:'💡 LINEE LUCI',sensor:'🌡️ SENSORI'};return header(labels[kind])+`<button class="btn secondary small" onclick="goto('home')">‹ Home</button>${groupZones(kind,([id,d])=>`<div class="card row"><div><b>${esc(d.name)}</b><div class="muted mini">${kind==='door'?(d.open?'APERTA':'CHIUSA')+' · Soglia '+d.delay+' s':kind==='light'?(d.offline?'SHELLY OFFLINE':d.on?'LINEA ALIMENTATA':'LINEA NON ALIMENTATA'):(d.stale?'NON AGGIORNATO':d.temp.toFixed(1)+' °C · '+d.hum+' %')+' · '+(sensorIssues(d).length?sensorIssues(d).join(', '):'OK')}</div></div>${kind==='light'?`<button class="btn small secondary" ${!can('lights')||d.offline?'disabled':''} onclick="commandLight(${jsarg(id)})">${d.on?'Spegni':'Accendi'}</button>`:badge(kind==='door'?(d.open?'APERTA':'CHIUSA'):kind==='sensor'?(sensorIssues(d).length?'ATTENZIONE':'OK'):'DEMO',kind==='sensor'&&!!sensorIssues(d).length)}</div>`)}${!activeDevices(kind).length?'<div class="empty">Nessun dispositivo abilitato</div>':''}`}
function zoneView(){const conf=state.zoneConfigs[currentZone];if(!conf||conf.status!=='active')return header('Zona non disponibile');const doors=activeDevices('door',conf.id),sensors=activeDevices('sensor',conf.id),lights=activeDevices('light',conf.id),waters=activeDevices('water',conf.id),num=active().filter(a=>a.zone===conf.id).length;return header(esc(conf.icon)+' '+esc(conf.name))+`<button class="btn secondary small" onclick="goto('zones')">‹ Zone</button><div class="card row"><b>STATO ZONA</b>${badge(num?num+' AVVISI':'REGOLARE',!!num)}</div><div class="section">🚪 PORTE</div>${doors.map(([id,d])=>`<div class="card row"><b>${esc(d.name)}</b>${badge(d.open?'APERTA':'CHIUSA',d.open)}</div>`).join('')||'<div class="card muted">Nessuna porta abilitata</div>'}<div class="section">💡 LINEE LUCI</div>${lights.map(([id,d])=>`<div class="card row"><div><b>${esc(d.name)}</b><div class="muted mini">${d.offline?'SHELLY OFFLINE':d.on?'LINEA ALIMENTATA':'LINEA NON ALIMENTATA'}</div></div><button class="btn small secondary" ${!can('lights')||d.offline?'disabled':''} onclick="commandLight(${jsarg(id)})">${d.on?'Spegni':'Accendi'}</button></div>`).join('')||'<div class="card muted">Nessuna linea abilitata</div>'}<div class="section">🌡️ TEMPERATURA E UMIDITÀ</div>${sensors.map(([id,d])=>`<div class="card"><div class="row"><b>${esc(d.name)}</b>${badge(sensorIssues(d).length?'ATTENZIONE':'OK',!!sensorIssues(d).length)}</div><p>${d.stale?'NON AGGIORNATO':d.temp.toFixed(1)+' °C · '+d.hum+' %'}</p><button class="btn secondary small" onclick="chartSensor=${jsarg(id)};goto('history')">📈 Grafico DEMO</button></div>`).join('')||'<div class="card muted">Nessun sensore abilitato</div>'}${waters.length?`<div class="section">💧 SERBATOI</div>${waters.map(([id,d])=>`<div class="card row"><b>${esc(d.name)}</b>${badge(d.low?'LIVELLO BASSO':'SUFFICIENTE',d.low)}</div>`).join('')}`:''}<div class="section">📷 TELECAMERE</div><button class="btn secondary" onclick="goto('cameras')">Apri telecamere ›</button>`}

function settingsView(){if(!admin())return header('Accesso non autorizzato');return header('⚙️ IMPOSTAZIONI')+`<div class="banner">DEMO · Impostazioni locali al browser. PIN 1234 non sicuro.</div><button class="btn secondary" onclick="goto('zoneadmin')">🗺️ Gestione zone</button><div class="section">UTENTI E AUTORIZZAZIONI</div>${state.users.map(u=>`<div class="card"><label class="field">Nome · ${esc(u.id)}<input id="name-${u.id}" value="${esc(u.name)}"></label><label class="field">Ruolo<select id="role-${u.id}" ${u.id==='admin'?'disabled':''}>${['Amministratore','Operatore','Ospite'].map(r=>`<option ${u.role===r?'selected':''}>${r}</option>`).join('')}</select></label>${u.id!=='admin'?`<label class="switch"><input type="checkbox" id="enabled-${u.id}" ${u.enabled!==false?'checked':''}> Utente abilitato</label><p class="muted mini">Permessi individuali (indipendenti dal ruolo)</p>${[['lights','Comando luci'],['ack','Presa in carico anomalie'],['cameras','Visualizzazione telecamere']].map(([k,t])=>`<label class="switch"><input type="checkbox" id="perm-${u.id}-${k}" ${u.permissions?.[k]?'checked':''}> ${t}</label>`).join('')}`:'<p class="muted mini">Amministratore principale: sempre attivo e non declassabile.</p>'}</div>`).join('')}<button class="btn" onclick="saveUsers04()">💾 Salva utenti</button><div class="section">DISPOSITIVI</div><p class="muted mini">I dispositivi disabilitati non appaiono nelle schermate operative. Le soglie sono individuali.</p>${zoneList().map(z=>`<div class="section">${esc(z.icon)} ${esc(z.name)}</div>${Object.entries(state.devices).filter(([id,d])=>d.zone===z.id).map(([id,d])=>`<div class="card"><label class="field mini">${esc(id)} · Nome<input data-name="${esc(id)}" value="${esc(d.name)}"></label><label class="switch"><input type="checkbox" data-enabled="${esc(id)}" ${d.enabled!==false?'checked':''}> Abilitato</label>${d.kind==='door'?`<label class="field mini">Tempo massimo apertura (secondi)<input type="number" min="1" step="1" data-delay="${esc(id)}" value="${d.delay}"></label>`:''}${d.kind==='sensor'?`<div class="config-grid">${[['tMin','Temperatura minima °C'],['tMax','Temperatura massima °C'],['hMin','Umidità minima %'],['hMax','Umidità massima %'],['confirmSeconds','Conferma anomalia (secondi)']].map(([k,label])=>`<label class="field mini">${label}<input type="number" step="${k==='confirmSeconds'?'1':'0.1'}" data-config="${esc(id)}" data-prop="${k}" value="${d[k]}"></label>`).join('')}</div>`:''}</div>`).join('')}`).join('')}<div class="section">AGGIUNGI DISPOSITIVO</div><div class="card"><label class="field">Zona<select id="add-zone">${zoneOptions()}</select></label><label class="field">Tipo<select id="add-kind"><option value="camera">Telecamera</option><option value="door">Sensore porta</option><option value="sensor">SHT31 temperatura/umidità</option><option value="light">Linea luci</option><option value="water">Livello serbatoio</option></select></label><label class="field">Nome<input id="add-name" placeholder="Es. Camera pollaio"></label><button class="btn secondary" onclick="addDevice04()">＋ Aggiungi dispositivo</button></div><button class="btn" style="width:100%" onclick="saveDevices04()">💾 SALVA DISPOSITIVI</button>`}
function saveUsers04(){if(!admin())return;for(const u of state.users){const name=$('name-'+u.id)?.value.trim();if(name)u.name=name;if(u.id==='admin')continue;u.role=$('role-'+u.id).value;u.enabled=$('enabled-'+u.id).checked;u.permissions={};for(const k of Object.keys(V04_DEFAULT_PERMS))u.permissions[k]=$('perm-'+u.id+'-'+k).checked}user=state.users.find(u=>u.id===user.id);event('Utenti e permessi aggiornati');save();alert('Utenti salvati (solo DEMO)');render()}
function saveDevices04(){if(!admin())return;const updated={};for(const [id,d] of Object.entries(state.devices)){const name=document.querySelector(`[data-name="${id}"]`);if(!name)continue;const copy={...d};copy.name=name.value.trim()||d.name;copy.enabled=document.querySelector(`[data-enabled="${id}"]`).checked;const delay=document.querySelector(`[data-delay="${id}"]`);if(delay){copy.delay=Number(delay.value);if(!Number.isFinite(copy.delay)||copy.delay<1){alert('Tempo porta non valido: '+copy.name);return}}for(const el of document.querySelectorAll(`[data-config="${id}"]`)){const v=Number(el.value);if(!el.value.trim()||!Number.isFinite(v)){alert('Valore non valido: '+copy.name);return}copy[el.dataset.prop]=v}if(copy.kind==='sensor'&&(copy.tMin>=copy.tMax||copy.hMin>=copy.hMax||copy.hMin<0||copy.hMax>100||copy.confirmSeconds<0)){alert('Soglie non valide: '+copy.name);return}updated[id]=copy}Object.assign(state.devices,updated);event('Configurazione dispositivi aggiornata');sync();save();alert('Dispositivi salvati (solo DEMO)');render()}
