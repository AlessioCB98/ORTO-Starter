<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ORTO Starter · DEMO</title><style>
:root{font-family:Inter,system-ui,-apple-system,sans-serif;color:#19362c;background:#f4f6f1}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}header{background:#fff;border-bottom:1px solid #e1e7de;position:sticky;top:0;z-index:3}.top{max-width:1050px;margin:auto;padding:14px 18px;display:flex;align-items:center;justify-content:space-between}.brand{font-size:21px;font-weight:800;letter-spacing:-.6px}.sub{font-size:12px;color:#738177}.pill{background:#fff0d5;color:#885b08;border-radius:99px;padding:7px 11px;font-size:12px;font-weight:800}.wrap{max-width:1050px;margin:auto;padding:24px 16px 110px}h1{font-size:27px;margin:0 0 6px;letter-spacing:-.7px}h2{font-size:19px;margin:26px 0 13px}.muted{color:#728178;font-size:14px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{background:white;border:1px solid #e3e9e1;border-radius:18px;padding:17px;box-shadow:0 2px 8px #1e3a2810}.zone{cursor:pointer;text-align:left;min-height:135px}.zone .emoji{font-size:29px}.zone strong{display:block;margin:10px 0 5px;font-size:17px}.status{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700}.dot{width:8px;height:8px;border-radius:50%;background:#278c62}.bad .dot{background:#d85d42}.bad{color:#b34730}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:20px 0}.summary .card{padding:13px}.big{font-size:26px;font-weight:800}.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.stack{display:grid;gap:11px}.btn{border:0;border-radius:11px;padding:10px 13px;background:#1c6549;color:white;font-weight:700}.btn.secondary{background:#e9f1e9;color:#245c44}.btn.warn{background:#fce6df;color:#a74430}.btn:disabled{opacity:.45;cursor:not-allowed}.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #dfe7de;display:flex;justify-content:center;z-index:5;padding-bottom:env(safe-area-inset-bottom)}.navinner{display:flex;width:100%;max-width:750px}.nav button{flex:1;border:0;background:none;padding:12px 1px 10px;color:#718076;font-size:11px}.nav button b{display:block;font-size:21px;margin-bottom:3px}.nav button.active{color:#176545;font-weight:800}.field{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.field input[type=range]{flex:1;min-width:100px;accent-color:#227854}.field input[type=number]{width:76px;padding:8px;border:1px solid #dce4db;border-radius:9px}.tag{padding:4px 8px;border-radius:7px;background:#eaf1ec;font-size:11px;font-weight:700}.tag.red{background:#fce5df;color:#ad3d2b}.tag.amber{background:#fff1d8;color:#98610b}.notice{border-left:4px solid #d65a41}.notice.ok{border-color:#39916a}.notice small{color:#748177}.detail{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}.back{background:none;border:0;color:#206a4b;font-weight:800;padding:0;margin-bottom:18px}.empty{padding:32px;text-align:center;color:#728178}.alertbar{padding:12px;border-radius:12px;background:#fff1dc;color:#825a18;margin:16px 0}.switch{border-radius:99px;padding:8px 13px;border:1px solid #dce7dc;background:#eef2ed;color:#4b6255;font-weight:800}.switch.on{background:#d8f2e2;color:#176444}.simbox{border:2px dashed #e7b55e;background:#fffbf1;border-radius:17px;padding:15px;margin-top:18px}.simbox h2{margin:0 0 5px}.select{border:1px solid #dce4db;background:#fff;border-radius:9px;padding:10px;max-width:100%}.mini{font-size:12px;color:#738177}.line{border-top:1px solid #e9eee8;margin:13px 0}.hidden{display:none}.chart{width:100%;height:160px;display:block}.login{max-width:390px;margin:55px auto}.login input{width:100%;padding:12px;border:1px solid #dbe5dc;border-radius:10px;margin:7px 0 14px}.login .btn{width:100%}@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}.wrap{padding-top:35px}.zone{min-height:160px}}
</style></head><body><header><div class="top"><div><div class="brand">🌱 ORTO <span style="color:#4a9270">Starter</span></div><div class="sub">Allevamento familiare</div></div><div class="row"><span class="pill">● DEMO ISOLATA</span><span id="userLabel" class="mini"></span></div></div></header><main id="app" class="wrap"></main><nav class="nav" id="nav"></nav><script>
const zones=[{id:'conigli',name:'Conigli',emoji:'🐇',doors:8},{id:'pollaio',name:'Pollaio',emoji:'🐔',doors:3},{id:'quaglie',name:'Quaglie',emoji:'🥚',doors:2},{id:'baracca',name:'Baracca',emoji:'🏠',doors:2}];const $=id=>document.getElementById(id);const now=()=>new Date().toLocaleTimeString('it-IT');const stamp=()=>new Date().toISOString();const uid=()=>Math.random().toString(36).slice(2,9).toUpperCase();let page='home',chosen='conigli',user=null,simZone='conigli',tick=0;
const fresh=()=>({zones:Object.fromEntries(zones.map((z,i)=>[z.id,{sensors:[{t:20+i*.4,h:57,online:true},{t:20.6+i*.4,h:59,online:true}],doors:Array(z.doors).fill(false),light:false,online:true}])),water:[false,false],backupFail:false,networkFail:false,alerts:[],events:[],history:Object.fromEntries(zones.map(z=>[z.id,[]]))});let state=fresh();function log(message){state.events.unshift({time:now(),message});state.events=state.events.slice(0,150)}function record(){zones.forEach(z=>{let s=state.zones[z.id];state.history[z.id].push({time:now(),t:s.sensors[0].t,h:s.sensors[0].h});state.history[z.id]=state.history[z.id].slice(-70)})}function conditions(){let list=[];zones.forEach(z=>{let s=state.zones[z.id];s.doors.forEach((v,i)=>{if(v)list.push([z.id,'Contatto '+(i+1),'Sportello aperto', 'media'])});s.sensors.forEach((v,i)=>{if(!v.online)list.push([z.id,'SHT31-'+(i+1),'Sensore non aggiornato','alta']);else{if(v.t>30||v.t<8)list.push([z.id,'SHT31-'+(i+1),'Temperatura fuori soglia','alta']);if(v.h>80||v.h<30)list.push([z.id,'SHT31-'+(i+1),'Umidità fuori soglia','media'])}});if(!s.online)list.push([z.id,'Controller','Controller offline','alta'])});state.water.forEach((v,i)=>{if(v)list.push(['baracca','Serbatoio '+(i+1),'Livello acqua basso','alta'])});if(state.backupFail)list.push(['baracca','Backup','Ultimo backup fallito','alta']);if(state.networkFail)list.push(['baracca','Rete','Connettività non disponibile','alta']);return list}function reconcile(){let keys=new Set();conditions().forEach(([zone,device,title,severity])=>{let key=zone+'|'+device+'|'+title;keys.add(key);if(!state.alerts.some(a=>a.key===key&&a.status!=='risolta')){let a={id:uid(),key,zone,device,title,severity,status:'attiva',start:now(),takenBy:null,takenAt:null,resolvedAt:null};state.alerts.unshift(a);log('⚠️ '+title+' · '+device+' · '+zone)}});state.alerts.filter(a=>a.status!=='risolta'&&!keys.has(a.key)).forEach(a=>{a.status='risolta';a.resolvedAt=now();log('✓ Risolta: '+a.title+' · '+a.device)});render()}function active(){return state.alerts.filter(a=>a.status!=='risolta')}function zoneCount(id){return active().filter(a=>a.zone===id).length}function go(p,id){page=p;if(id)chosen=id;render();window.scrollTo(0,0)}function canSim(){return user?.role==='admin'}function requireAdmin(){if(!canSim()){alert('Operazione riservata all’amministratore');return false}return true}function setDoor(z,i){if(!requireAdmin())return;state.zones[z].doors[i]=!state.zones[z].doors[i];log('DEMO · '+z+' · contatto '+(i+1)+' '+(state.zones[z].doors[i]?'aperto':'chiuso'));reconcile()}function setSensor(z,i,k,v){if(!requireAdmin())return;state.zones[z].sensors[i][k]=Number(v);log('DEMO · '+z+' · sensore '+(i+1)+' '+k+' = '+v);record();reconcile()}function flip(z,k,i){if(!requireAdmin())return;if(k==='water')state.water[i]=!state.water[i];else if(k==='backupFail'||k==='networkFail')state[k]=!state[k];else if(k==='sensor')state.zones[z].sensors[i].online=!state.zones[z].sensors[i].online;else state.zones[z].online=!state.zones[z].online;log('DEMO · modifica '+k+' · '+z);reconcile()}function light(z){state.zones[z].light=!state.zones[z].light;log('DEMO · luce '+z+' '+(state.zones[z].light?'accesa':'spenta')+' da '+user.name);render()}function take(id){let a=state.alerts.find(x=>x.id===id);if(!a||a.status==='risolta')return;a.status='presa in carico';a.takenBy=user.name;a.takenAt=now();log('Avviso '+a.id+' preso in carico da '+user.name);render()}function reset(){if(!requireAdmin())return;if(!confirm('Ripristinare tutti i dati della DEMO?'))return;state=fresh();record();render()}function status(n){return n?'<span class="status bad"><i class="dot"></i>'+n+' avvisi</span>':'<span class="status"><i class="dot"></i>Regolare</span>'}function intro(t,s){return '<h1>'+t+'</h1><div class="muted">'+s+'</div>'}function zoneCards(){return '<div class="grid">'+zones.map(z=>'<button class="card zone" onclick="go(\'zone\',\''+z.id+'\')"><div class="emoji">'+z.emoji+'</div><strong>'+z.name+'</strong>'+status(zoneCount(z.id))+'</button>').join('')+'</div>'}function home(){return intro('Buongiorno, '+user.name+' 👋','Panoramica in tempo reale · dati simulati')+'<div class="summary"><div class="card"><div class="big">4</div><div class="mini">Zone</div></div><div class="card"><div class="big">'+active().length+'</div><div class="mini">Avvisi attivi</div></div><div class="card"><div class="big">'+zones.filter(z=>state.zones[z.id].online).length+'/4</div><div class="mini">Controller OK</div></div></div>'+(active().length?'<div class="alertbar">⚠️ '+active().length+' anomalie da verificare <button class="btn secondary" onclick="go(\'alerts\')">Apri avvisi</button></div>':'')+'<h2>Le tue zone</h2>'+zoneCards()+'<h2>Azioni rapide</h2><div class="row"><button class="btn secondary" onclick="go(\'alerts\')">🔔 Avvisi</button><button class="btn secondary" onclick="go(\'sim\')">🧪 Simulatore</button></div>'}function zoneView(){let z=zones.find(x=>x.id===chosen),s=state.zones[z.id];return '<button class="back" onclick="go(\'zones\')">← Tutte le zone</button>'+intro(z.emoji+' '+z.name,'Stato ambientale, accessi e dispositivi · DEMO')+'<div class="alertbar" style="background:'+(zoneCount(z.id)?'#fff0e4':'#e8f5eb')+'">'+(zoneCount(z.id)?'⚠️ '+zoneCount(z.id)+' anomalie presenti':'✓ Nessuna anomalia attiva')+'</div><h2>Ambiente</h2><div class="grid">'+s.sensors.map((v,i)=>'<div class="card"><div class="row"><b>SHT31-'+(i+1)+'</b><span class="tag '+(!v.online?'red':'')+'">'+(v.online?'Online':'Offline')+'</span></div><div class="big" style="margin-top:15px">'+v.t.toFixed(1)+'°C</div><div class="muted">💧 '+v.h.toFixed(0)+'% umidità</div></div>').join('')+'</div><h2>Illuminazione</h2><div class="card row"><div><b>Luce '+z.name+'</b><div class="mini">Shelly Plus 1 · stato simulato</div></div><button class="switch '+(s.light?'on':'')+'" onclick="light(\''+z.id+'\')">'+(s.light?'● Accesa':'○ Spenta')+'</button></div><h2>Contatti magnetici</h2><div class="stack">'+s.doors.map((v,i)=>'<div class="card row"><div><b>Contatto '+(i+1)+'</b><div class="mini">'+(v?'Aperto':'Chiuso')+'</div></div><span class="tag '+(v?'amber':'')+'">'+(v?'APERTO':'CHIUSO')+'</span></div>').join('')+'</div><h2>Controller</h2><div class="card row"><b>'+({conigli:'ESP32-02',pollaio:'ESP32-03',quaglie:'ESP32-03',baracca:'ESP32-01'}[z.id])+'</b><span class="tag '+(!s.online?'red':'')+'">'+(s.online?'Online':'Offline')+'</span></div>'+(canSim()?'<div class="simbox"><b>🧪 Vuoi simulare un evento?</b><p class="mini">Apri il pannello DEMO per modificare sensori e contatti.</p><button class="btn" onclick="simZone=\''+z.id+'\';go(\'sim\')">Apri simulatore</button></div>':'')}function alerts(){let a=state.alerts;return intro('Avvisi','Presa in carico distinta dalla risoluzione')+'<div class="row" style="margin:20px 0"><span class="tag red">'+active().length+' aperti</span><span class="tag">'+a.filter(x=>x.status==='risolta').length+' risolti</span></div><div class="stack">'+(a.length?a.map(x=>'<div class="card notice '+(x.status==='risolta'?'ok':'')+'"><div class="row"><b>'+x.title+'</b><span class="tag '+(x.status==='risolta'?'':'red')+'">'+x.status+'</span></div><p class="muted">'+x.zone+' · '+x.device+' · gravità '+x.severity+'</p><small>ID '+x.id+' · inizio '+x.start+(x.takenBy?' · in carico a '+x.takenBy+' alle '+x.takenAt:'')+(x.resolvedAt?' · risolta '+x.resolvedAt:'')+'</small>'+(x.status==='attiva'?'<div style="margin-top:12px"><button class="btn secondary" onclick="take(\''+x.id+'\')">Prendi in carico</button></div>':'')+'</div>').join(''):'<div class="card empty">✓ Nessun avviso generato. Prova il simulatore.</div>')+'</div>'}function chart(vals){if(!vals.length)return '<div class="empty">Nessun dato</div>';let w=600,h=140,min=Math.min(...vals)-1,max=Math.max(...vals)+1;let pts=vals.map((v,i)=>(i*600/Math.max(vals.length-1,1))+','+(h-(v-min)/(max-min)*h)).join(' ');return '<svg class="chart" viewBox="0 0 600 160" preserveAspectRatio="none"><line x1="0" y1="145" x2="600" y2="145" stroke="#d8e6db"/><polyline points="'+pts+'" fill="none" stroke="#29805b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>'}function history(){let h=state.history[chosen];return intro('Storico','Campioni simulati in memoria · nessun database')+'<div class="field" style="margin:20px 0"><select class="select" onchange="chosen=this.value;render()">'+zones.map(z=>'<option value="'+z.id+'" '+(chosen===z.id?'selected':'')+'>'+z.name+'</option>').join('')+'</select></div><div class="card"><b>Temperatura · SHT31-1</b>'+chart(h.map(x=>x.t))+'<div class="mini">'+h.length+' campioni · ultimo '+(h.at(-1)?.time||'—')+'</div></div><h2>Eventi recenti</h2><div class="stack">'+(state.events.length?state.events.slice(0,30).map(e=>'<div class="card"><span class="mini">'+e.time+'</span><div>'+e.message+'</div></div>').join(''):'<div class="card empty">Nessun evento</div>')+'</div>'}function sim(){if(!canSim())return intro('Simulatore','Accesso riservato all’amministratore')+'<div class="card">Il tuo profilo non può modificare la simulazione.</div>';let z=zones.find(x=>x.id===simZone),s=state.zones[z.id];return intro('🧪 Simulatore','Ambiente DEMO completamente isolato · nessun comando hardware')+'<div class="alertbar">Le modifiche agiscono solo sui dati in memoria del browser. Le anomalie sono immediate in questa V0.1.</div><div class="field" style="margin:20px 0"><select class="select" onchange="simZone=this.value;render()">'+zones.map(q=>'<option value="'+q.id+'" '+(q.id===z.id?'selected':'')+'>'+q.name+'</option>').join('')+'</select></div><h2>Sensori SHT31</h2><div class="stack">'+s.sensors.map((v,i)=>'<div class="card"><div class="row"><b>Sensore '+(i+1)+'</b><button class="switch '+(v.online?'on':'')+'" onclick="flip(\''+z.id+'\',\'sensor\','+i+')">'+(v.online?'Online':'Offline')+'</button></div><p class="mini">Temperatura °C</p><div class="field"><input type="range" min="0" max="45" step="0.5" value="'+v.t+'" oninput="setSensor(\''+z.id+'\','+i+',\'t\',this.value)"><b>'+v.t.toFixed(1)+'°</b></div><p class="mini">Umidità %</p><div class="field"><input type="range" min="10" max="95" step="1" value="'+v.h+'" oninput="setSensor(\''+z.id+'\','+i+',\'h\',this.value)"><b>'+v.h+'%</b></div></div>').join('')+'</div><h2>Contatti magnetici</h2><div class="card stack">'+s.doors.map((v,i)=>'<div class="row"><span>Contatto '+(i+1)+'</span><button class="switch '+(v?'':'on')+'" onclick="setDoor(\''+z.id+'\','+i+')">'+(v?'Aperto':'Chiuso')+'</button></div>').join('')+'</div><h2>Guasti simulati</h2><div class="card stack"><div class="row"><span>Controller '+z.name+'</span><button class="switch '+(s.online?'on':'')+'" onclick="flip(\''+z.id+'\',\'controller\')">'+(s.online?'Online':'Offline')+'</button></div>'+state.water.map((v,i)=>'<div class="row"><span>Serbatoio '+(i+1)+'</span><button class="switch '+(!v?'on':'')+'" onclick="flip(\'\',\'water\','+i+')">'+(v?'Livello basso':'Livello OK')+'</button></div>').join('')+'<div class="row"><span>Backup</span><button class="switch '+(!state.backupFail?'on':'')+'" onclick="flip(\'\',\'backupFail\')">'+(state.backupFail?'Errore':'OK')+'</button></div><div class="row"><span>Rete</span><button class="switch '+(!state.networkFail?'on':'')+'" onclick="flip(\'\',\'networkFail\')">'+(state.networkFail?'Guasto':'OK')+'</button></div></div><div style="margin-top:22px"><button class="btn warn" onclick="reset()">Ripristina DEMO</button></div>'}function menu(){return intro('Menu','Strumenti e impostazioni')+'<div class="stack" style="margin-top:20px">'+[['🧪 Simulatore','sim'],['📹 Telecamere · anteprima non disponibile','cameras'],['🩺 Diagnostica tecnica','diagnostics'],['👤 Cambia utente','logout']].map(x=>'<button class="card row" onclick="go(\''+x[1]+'\')"><b>'+x[0]+'</b><span>›</span></button>').join('')+'</div>'}function diagnostics(){return intro('Diagnostica','Stati di esempio · nessun servizio interrogato')+'<div class="stack" style="margin-top:20px">'+['Brain-01','ORTO API','MQTT','Companion','SQLite','Backup USB','Rete LAN','Internet','Shelly','Telecamere'].map(x=>'<div class="card row"><b>'+x+'</b><span class="tag amber">Non collegato</span></div>').join('')+'</div>'}function cameras(){return intro('Telecamere','Anteprima riservata ai flussi reali disponibili')+'<div class="card empty">📹 Nessun flusso collegato. Non vengono mostrati video fittizi come live.</div>'}function login(){return '<div class="card login"><h1>🌱 Accedi a ORTO</h1><p class="muted">Accesso locale dimostrativo</p><label>Utente</label><select id="loginUser" class="select" style="width:100%;margin:8px 0 16px"><option value="admin">Socio 1 · Amministratore</option><option value="operator2">Socio 2 · Operatore</option><option value="operator3">Socio 3 · Operatore</option></select><label>PIN dimostrativo</label><input id="pin" type="password" inputmode="numeric" maxlength="4" placeholder="4 cifre"><button class="btn" onclick="signIn()">Entra nella DEMO</button><p class="mini">PIN demo: 1234 per tutti. Non è autenticazione sicura: sarà implementata nel backend.</p></div>'}function signIn(){if($('pin').value!=='1234'){alert('PIN DEMO non valido');return}let u=$('loginUser').value;user={name:u==='admin'?'Socio 1':u==='operator2'?'Socio 2':'Socio 3',role:u==='admin'?'admin':'operator'};page='home';render()}function render(){if(page==='logout'){user=null;page='home'}$('userLabel').textContent=user?user.name:'';$('nav').style.display=user?'flex':'none';if(!user){$('app').innerHTML=login();return}let html=page==='home'?home():page==='zones'?intro('Le quattro zone','Seleziona un’area per consultare lo stato')+'<div style="margin-top:20px">'+zoneCards()+'</div>':page==='zone'?zoneView():page==='alerts'?alerts():page==='history'?history():page==='sim'?sim():page==='diagnostics'?diagnostics():page==='cameras'?cameras():menu();$('app').innerHTML=html;let navs=[['home','⌂','Home'],['zones','▦','Zone'],['alerts','♧','Avvisi'],['history','▥','Storico'],['menu','☰','Menu']];$('nav').innerHTML='<div class="navinner">'+navs.map(n=>'<button class="'+(page===n[0]||page==='zone'&&n[0]==='zones'?'active':'')+'" onclick="go(\''+n[0]+'\')"><b>'+n[1]+'</b>'+n[2]+(n[0]==='alerts'&&active().length?' ('+active().length+')':'')+'</button>').join('')+'</div>'}record();setInterval(()=>{if(!user)return;tick++;zones.forEach(z=>state.zones[z.id].sensors.forEach(s=>{if(s.online){s.t=Math.max(0,Math.min(45,s.t+(Math.random()-.5)*.12));s.h=Math.max(10,Math.min(95,s.h+(Math.random()-.5)*.3))}}));if(tick%5===0)record();if(page!=='sim')reconcile()},30000);render();
</script></body></html>
