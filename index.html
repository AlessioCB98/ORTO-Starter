:root{font-family:system-ui,-apple-system,Arial,sans-serif;background:#080b09;color:#f3f5f3}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.4;cursor:not-allowed}.wrap{max-width:850px;margin:auto;padding:20px 16px 110px}.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:6px 0 22px}.top h1{font-size:clamp(23px,6vw,35px);margin:0}.muted{color:#9da59f}.tag{font-size:12px;border:1px solid #dfb73c;color:#f5ce55;border-radius:30px;padding:6px 10px;font-weight:800}.card{background:#151a17;border:1px solid #303832;border-radius:24px;padding:19px;margin:13px 0}.subcard{background:#1e2420;border-radius:18px;padding:14px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.grid3{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.tile{background:#191f1b;border:1px solid #343c35;border-radius:19px;padding:18px 12px;text-align:center;color:inherit;min-height:105px}.tile b{display:block;margin-top:8px}.tile small{display:block;margin-top:5px;color:#aab2ac}.tile.good{border:2px solid #32c765;background:#153522}.tile.bad{border:2px solid #e65a5a;background:#3b1d1d}.tile.warn{border:2px solid #e3b83e;background:#3b321b}.tile.neutral{border:2px solid #757e77}.section{margin:26px 2px 12px;color:#a5aca6;letter-spacing:2px;font-weight:800}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.row>*{min-width:0}.pill{display:inline-block;border-radius:30px;background:#163b23;color:#37d26e;padding:7px 10px;font-size:12px;font-weight:800}.pill.red{background:#4a2020;color:#ff7777}.pill.yellow{background:#403419;color:#f3ce61}.btn{background:#32c765;color:#07140b;border:0;border-radius:15px;padding:13px 16px;font-weight:800}.btn.secondary{background:#252c27;color:#f2f4f2;border:1px solid #465047}.btn.danger{background:#512222;color:#fff;border:1px solid #e65a5a}.btn.small{padding:9px 12px;font-size:13px}.stack{display:grid;gap:10px 'use strict';const KEY='orto_starter_demo_v02';const zones=[['conigli','🐇','CONIGLI',8],['pollaio','🐓','POLLAIO',3],['quaglie','🐦','QUAGLIE',2],['baracca','🏠','BARACCA',2]];const defaults=()=>({users:[{id:'admin',name:'Alessio',role:'Amministratore'},{id:'op2',name:'Operatore 2',role:'Operatore'},{id:'op3',name:'Operatore 3',role:'Operatore'},{id:'guest',name:'Ospite',role:'Ospite',enabled:false}],devices:Object.fromEntries(zones.flatMap(([z,,name,n])=>[...Array.from({length:n},(_,i)=>[`door-${z}-${i+1}`,{name:`Sportello ${i+1}`,zone:z,kind:'door',open:false,changed:Date.now(),stale:false}]),...[1,2].map(i=>[`sensor-${z}-${i}`,{name:`SHT31-${i}`,zone:z,kind:'sensor',temp:19+i*.2,hum:60+i,stale:false}]),[`light-${z}`,{name:`Linea luci ${name.toLowerCase()}`,zone:z,kind:'light',on:false,offline:false}],...(z==='baracca'?[['water-1',{name:'Serbatoio 1',zone:z,kind:'water',low:false}]]:[])])),alerts:[],events:[],seq:0,issues:{brain:false,network:false,backup:false},settings:{doorDelay:30},created:Date.now()});let state;try{state=JSON.parse(localStorage.getItem(KEY))||defaults();if(!state.devices||!state.users)throw 0}catch{state=defaults()}let user=null,page='home',currentZone='conigli',selectedAlert=null,chartSensor='sensor-conigli-1',chartPoints=[];const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),date=t=>new Date(t).toLocaleString('it-IT',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}),save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch{}},dev=id=>state.devices[id],admin=()=>user?.role==='Amministratore',event=(msg)=>{state.events.unshift({at:Date.now(),msg});state.events=state.events.slice(0,250)},active=()=>state.alerts.filter(a=>a.status!=='resolved'&&!a.archived),openCount=z=>Object.values(state.devices).filter(d=>d.kind==='door'&&(!z||d.zone===z)&&d.open).length,allDoors=z=>Object.values(state.devices).filter(d=>d.kind==='door'&&(!z||d.zone===z)).length;function sync(){const now=Date.now(),conditions=[];for(const [id,d] of Object.entries(state.devices)){if(d.kind==='door'&&d.open&&now-d.changed>=state.settings.doorDelay*1000)conditions.push([id,'Sportello aperto oltre il tempo previsto','Alta']);if(d.kind==='sensor'){if(d.temp>30||d.temp<5)conditions.push([id,'Temperatura fuori soglia','Alta']);else if(d.hum>80||d.hum<30)conditions.push([id,'Umidità fuori soglia','Media']);if(d.stale)conditions.push([id,'Sensore non aggiornato','Media'])}if(d.kind==='water'&&d.low)conditions.push([id,'Livello acqua basso','Alta']);if(d.kind==='light'&&d.offline)conditions.push([id,'Shelly offline','Alta'])}for(const [id,on] of Object.entries(state.issues))if(on)conditions.push(['sys-'+id,({brain:'Brain-01 offline',network:'Rete non disponibile',backup:'Backup non riuscito'})[id],'Alta']);const keys=new Set(conditions.map(([id,msg])=>id+'|'+msg));for(const [id,msg,severity] of conditions){let a=state.alerts.find(a=>a.key===id+'|'+msg&&a.status!=='resolved');if(!a){a={id:'ALT-'+String(++state.seq).padStart(4,'0'),key:id+'|'+msg,device:id,zone:dev(id)?.zone||'sistema',msg,severity,start:now,status:'active',events:[{at:now,msg:'Anomalia rilevata'}]};state.alerts.unshift(a);event(a.id+' · '+msg)}}for(const a of state.alerts)if(a.status!=='resolved'&&!keys.has(a.key)){a.status='resolved';a.resolved=now;a.events.push({at:now,msg:'Condizione ripristinata · risoluzione automatica'});event(a.id+' · risolta automaticamente')}save()}function change(id,field,val){if(!admin())return;const d=dev(id);if(!d)return;d[field]=val;if(field==='open')d.changed=Date.now();event(`${d.name}: ${field} → ${val}`);sync();render()}function commandLight(id){if(!user||user.role==='Ospite')return;const d=dev(id);if(d.offline){alert('Shelly offline: comando non disponibile');return}d.on=!d.on;event(`${user.name}: ${d.name} ${d.on?'alimentata':'non alimentata'} (DEMO)`);save();render()}function login(){const id=$('login-user').value,pin=$('login-pin').value;const u=state.users.find(x=>x.id===id&&x.enabled!==false);if(!u||pin!=='1234'){alert('PIN DEMO non valido o utente disabilitato');return}user=u;page='home';event('Accesso DEMO: '+u.name);render()}function goto(p,z){page=p;if(z)currentZone=z;selectedAlert=null;render();window.scrollTo(0,0)}function header(title){return `<div class="top"><h1>${title}</h1><span class="tag">🧪 DEMO</span></div>`}function badge(t,bad=false){return `<span class="pill ${bad?'red':''}">${esc(t)}</span>`}function layout(content){$('app').innerHTML=`<main class="wrap">${content}</main>${user?`<nav class="nav">${[['home','🏠','Home'],['zones','🐇','Zone'],['alerts','🚨','Avvisi'],['history','📈','Storico'],['menu','☰','Menu']].map(([p,i,n])=>`<button class="${page===p||page==='zone'&&p==='zones'?'active':''}" onclick="goto('${p}')"><span>${i}</span>${n}</button>`).join('')}</nav>`:''}`}function render(){sync();if(!user){layout(`<div class="login"><div class="card"><h1>🌱</h1><h1>ORTO p.g.a.</h1><p class="muted">Controllo allevamento · STARTER</p><p><span class="tag">VERSIONE DEMO V0.2</span></p><label class="field">Utente<select id="login-user">${state.users.filter(u=>u.enabled!==false).map(u=>`<option value="${u.id}">${esc(u.name)} — ${u.role}</option>`).join('')}</select></label><label class="field">PIN<input id="login-pin" type="password" inputmode="numeric" placeholder="PIN dimostrativo" onkeydown="if(event.key==='Enter')login()"></label><button class="btn" style="width:100%" onclick="login()">ENTRA</button><p class="muted mini">PIN DEMO: 1234 · Non usare credenziali reali</p></div></div>`);return}let html='';if(page==='home')html=home();else if(page==='zones')html=header('🐇 Zone')+`<div class="grid">${zones.map(([id,icon,name])=>`<button class="tile" onclick="goto('zone','${id}')"><div class="num">${icon}</div><b>${name}</b><small>${openCount(id)} sportelli aperti</small></button>`).join('')}</div>`;else if(page==='zone')html=zoneView();else if(page==='alerts')html=alertsView();e {name}`)+`<button class="btn secondary small" onclick="goto('zones')">‹ Zone</button><div class="card"><div class="row"><b>STATO GENERALE</b>${badge(num?num+' AVVISI':'REGOLARE',!!num)}</div><div class="grid" style="margin-top:15px"><div class="subcard"><div class="muted mini">🌡️ TEMPERATURA</div><b>${sensors[0][1].stale?'—':sensors[0][1].temp.toFixed(1)+' °C'}</b></div><div class="subcard"><div class="muted mini">💧 UMIDITÀ</div><b>${sensors[0][1].stale?'—':sensors[0][1].hum+' %'}</b></div><div class="subcard"><div class="muted mini">🚪 SPORTELLI</div><b>${openCount(z)} / ${doors.length} aperti</b></div><div class="subcard"><div class="muted mini">💡 LINEA LUCI</div><b>${light[1].offline?'SCONOSCIUTO':light[1].on?'ALIMENTATA':'NON ALIMENTATA'}</b></div></div></div><div class="section">💡 ILLUMINAZIONE</div><button class="tile ${light[1].offline?'bad':light[1].on?'good':'neutral'}" style="width:100%" onclick="commandLight('${light[0]}')" ${light[1].offline||user.role==='Ospite'?'disabled':''}><div class="num">💡</div><b>${esc(light[1].name)}</b><small>${light[1].offline?'SHELLY OFFLINE':light[1].on?'LINEA ALIMENTATA':'LINEA NON ALIMENTATA'} · DEMO</small></button><div class="section">🚪 SPORTELLI</div><div class="grid3">${doors.map(([id,d])=>`<div class="tile ${d.open?'warn':'neutral'}"><div class="num">🚪</div><b>${esc(d.name)}</b><small>${d.open?'APERTO':'CHIUSO'}</small></div>`).join('')}</div><div class="section">🌡️ AMBIENTE · SHT31</div><div class="stack">${sensors.map(([id,d])=>`<div class="card"><div class="row"><b>${esc(d.name)}</b>${badge(d.stale?'NON AGGIORNATO':'ONLINE',d.stale)}</div><p>${d.stale?'Dati non aggiornati':d.temp.toFixed(1)+' °C · '+d.hum+' %'}</p><button class="btn secondary small" onclick="chartSensor='${id}';goto('history')">📈 Visualizza grafico</button></div>`).join('')}</div>${water.length?`<div class="section">💧 SERBATOI</div>${water.map(([id,d])=>`<div class="card row"><b>${esc(d.name)}</b>${badge(d.low?'LIVELLO BASSO':'SUFFICIENTE',d.low)}</div>`).join('')}`:''}<div class="section">📷 TELECAMERE</div><div class="card muted">Nessun flusso video configurato · Nessuna telecamera reale collegata</div>${admin()?'<button class="btn secondary" onclick="goto(\'demo\')">🧪 Apri simulatore</button>':''}`}function alertCard(a){return `<div class="alert ${a.severity==='Media'?'yellow':''} click" onclick="selectedAlert='${a.id}';gotoAlert()"><div class="row"><b>🔴 ${esc(a.zone.toUpperCase())} · ${esc(dev(a.device)?.name||a.device)}</b><span>›</span></div><p>${esc(a.msg)}</p><div class="mini muted">${a.id} · ${date(a.start)} · ${a.status==='ack'?'In carico':'Da prendere in carico'}</div></div>`}function gotoAlert(){page='alerts';render();window.scrollTo(0,0)}function alertsView(){const a=state.alerts.find(x=>x.id===selectedAlert);if(a)return header('🚨 Dettaglio avviso')+`<button class="btn secondary small" onclick="selectedAlert=null;render()">‹ Avvisi</button><div class="alert"><h2>${esc(a.id)} · ${esc(a.msg)}</h2><p>Zona: ${esc(a.zone)}<br>Dispositivo: ${esc(dev(a.device)?.name||a.device)}<br>Gravità: ${esc(a.severity)}<br>Inizio: ${date(a.start)}<br>Stato: ${a.status==='resolved'?'Risolta':a.status==='ack'?'In carico':'Attiva'}${a.by?'<br>In carico: '+esc(a.by)+' · '+date(a.ackAt):''}${a.resolved?'<br>Risolta: '+date(a.resolved):''}</p><div class="actions">${a.status==='active'&&user.role!=='Ospite'?`<button class="btn" onclick="ack('${a.id}')">Prendi in carico</button>`:''}<button class="btn secondary" onclick="sync();render()">Verifica risoluzione</button>${admin()&&a.status==='resolved'&&!a.archived?`<button class="btn secondary" onclick="archiveAlert('${a.id}')">Chiudi avviso</button>`:''}${admin()&&a.status!=='resolved'&&!a.archived?`<button class="btn danger" onclick="archiveAlert('${a.id}')">Chiusura amministrativa</button>`:''}</div></div><div class="section">CRONOLOGIA</div>${a.events.map(e=>`<div class="card mini">${date(e.at)} · ${esc(e.msg)}</div>`).join('')}`;return header('🚨 AVVISI')+`<div class="card row"><b>${active().length} anomalie attive</b>${badge('DEMO')}</div>${active().length?active().map(alertCard).join(''):'<div class="empty">✅ Nessuna anomalia attiva</div>'}<div class="section">RISOLTE / ARCHIVIATE</div>${state.alerts.filter(a=>a.status==='resolved'||a.archived).slice(0,25).map(a=>`<div class="card click" onclick="selectedAlert='${a.id}';render()"><b>${esc(a.id)} · ${esc(a.msg)}</b><div class="muted mini">${date(a.start)} · ${a.archived?'Archiviata':'Risolta'}</div></div>`).join('')||'<div class="muted">Nessuna</div>'}`}function ack(id){const a=state.alerts.find(x=>x.id===id);if(!a||a.status!=='active'||user.role==='Ospite')return;a.status='ack';a.by=user.name;a.ackAt=Date.now();a.events.push({at:Date.now(),msg:'Presa in carico da '+user.name});event(id+' preso in carico');save();render()}function archiveAlert(id){if(!admin())return;const a=state.alerts.find(x=>x.id===id);if(!a)return;let reason='';if(a.status!=='resolved'){reason=prompt('Motivazione obbligatoria della chiusura amministrativa (il guasto rimarrà attivo):')||'';if(!reason.trim())return}a.archived=true;a.events.push({at:Date.now(),msg:'Archiviato da '+user.name+(reason?' · '+reason:'')});event(id+' archiviato');save();render()}function historyView(){const d=dev(chartSensor)||Object.values(state.devices).find(d=>d.kind==='sensor');let points=Array.from({length:30},(_,i)=>({x:i,y:d.temp+Math.sin(i*.55)*.7+Math.cos(i*.24)*.4}));const poly=points.map((p,i)=>`${i*10},${110-(p.y-14)*9}`).join(' ');return header('📈 STORICO')+`<div class="banner">Grafici dimostrativi generati localmente; non sono misure storiche reali.</div><div class="card"><label class="field">Sensore<select onchange="chartSensor=this.value;render()">${Object.entries(state.devices).filter(([id,d])=>d.kind==='sensor').map(([id,d])=>`<option value="${id}" ${id===chartSensor?'selected':''}>${esc(zones.find(z=>z[0]===d.zone)[2])} · ${esc(d.name)}</option>`).join('')}</select></label><svg viewBox="0 0 300 130" preserveAspectRatio="none" aria-label="Grafico simulato"><path d="M0 115 H300" stroke="#485249"/><polyline points="${poly}" stroke="#38c86d" stroke-width="3" fill="none"/></svg><div class="muted mini">Andamento dimostrativo · °C</div></div><div class="section">EVENTI DELLA DEMO</div>${state.events.slice(0,60).map(e=>`<div class="card mini">${date(e.at)} · ${esc(e.msg)}</div>`).join('')||'<div class="empty">Nessun evento</div>'}`}function menuView(){return header('☰ MENU')+`<div class="stack"><div class="card"><b>${esc(user.name)}</b><div class="muted">${esc(user.role)}</div><button class="btn secondary small" style="margin-top:12px" onclick="user=null;page='home';render()">Esci</button></div><button class="btn secondary" onclick="goto('diagnostics')">🖥️ Visualizza dettagli tecnici</button>${admin()?'<button class="btn secondary" onclick="goto(\'settings\')">⚙️ Personalizzazione e impostazioni</button><button class="btn secondary" onclick="goto(\'demo\')">🧪 Simulatore DEMO / TEST</button>':''}</div>`}function diagnosticsView(){return header('🖥️ DIAGNOSTICA')+`<div class="banner">Valori dimostrativi: nessuna diagnostica hardware collegata.</div>${['Brain-01','ORTO API','MQTT','Companion','SQLite','Controller ESP32','Shelly','Telecamere','Backup','Rete locale','Internet'].map(n=>`<div class="card row"><b>${n}</b><span class="pill yellow">NON COLLEGATO</span></div>`).join('')}`}function demoView(){if(!admin())return header('Accesso non autorizzato');return header('🧪 DEMO / TEST')+`<div class="banner"><b>MODALITÀ DI SIMULAZIONE</b><p class="mini">Modifica sensori e stati. Le anomalie si aggiornano automaticamente. Nessun comando raggiunge dispositivi reali.</p></div><button class="btn danger" style="width:100%" onclick="resetDemo()">↻ RESET TUTTI I TEST</button><div class="section">SISTEMA</div>${Object.keys(state.issues).map(k=>`<div class="card row"><b>${({brain:'Brain-01',network:'Rete',backup:'Backup'})[k]}</b><button class="btn small ${state.issues[k]?'danger':'secondary'}" onclick="state.issues['${k}']=!state.issues['${k}'];event('Test ${k}');sync();render()">${state.issues[k]?'GUASTO':'NORMALE'}</button></div>`).join('')}${zones.map(([z,icon,name])=>`<div class="section">${icon} ${name}</div>${Object.entries(state.devices).filter(([id,d])=>d.zone===z).map(([id,d])=>`<div class="card"><div class="row"><b>${esc(d.name)}</b><span class="muted mini">${d.kind.toUpperCase()}</span></div>${d.kind==='door'?`<div class="actions"><button class="btn small ${d.open?'danger':'secondary'}" onclick="change('${id}','open',${!d.open})">${d.open?'APERTO · Chiudi':'CHIUSO · Apri'}</button></div>`:d.kind==='sensor'?`<div class="grid"><label class="field mini">Temperatura °C<input type="number" step="0.5" value="${d.temp}" onchange="change('${id}','temp',Number(this.value))"></label><label class="field mini">Umidità %<input type="number" min="0" max="100" value="${d.hum}" onchange="change('${id}','hum',Number(this.value))"></label></div><button class="btn secondary small" onclick="change('${id}','stale',${!d.stale})">${d.stale?'Ripristina aggiornamenti':'Simula sensore fermo'}</button>`:d.kind==='light'?`<div class="actions"><button class="btn secondary small" onclick="change('${id}','on',${!d.on})">Linea ${d.on?'alimentata':'non alimentata'}</button><button class="btn small ${d.offline?'danger':'secondary'}" onclick="change('${id}','offline',${!d.offline})">Shelly ${d.offline?'OFFLINE':'ONLINE'}</button></div>`:d.kind==='water'?`<button class="btn small ${d.low?'danger':'secondary'}" onclick="change('${id}','low',${!d.low})">${d.low?'LIVELLO BASSO':'LIVELLO SUFFICIENTE'}</button>`:''}</div>`).join('')}`).join('')}`}function resetDemo(){if(!confirm('Azzerare tutti gli stati e gli eventi DEMO? Anche i nomi personalizzati verranno ripristinati.'))return;state=defaults();event('Reset DEMO eseguito');save();render()}function settingsView(){if(!admin())return header('Accesso non autorizzato');return header('⚙️ PERSONALIZZAZIONE')+`<div class="banner">Le modifiche sono salvate soltanto in questo browser. La DEMO pubblica non dispone di autenticazione sicura.</div><div class="section">UTENTI</div>${state.users.map(u=>`<div class="card"><label class="field">${u.role} · ${u.id}<input id="name-${u.id}" value="${esc(u.name)}"></label>${u.id==='guest'?`<label class="switch"><input type="checkbox" id="guest-enabled" ${u.enabled?'checked':''}> Ospite abilitato (solo lettura)</label>`:''}</div>`).join('')}<div class="section">DISPOSITIVI</div>${zones.map(([z,icon,name])=>`<div class="section">${icon} ${name}</div>${Object.entries(state.devices).filter(([id,d])=>d.zone===z).map(([id,d])=>`<label class="field mini">${id}<input data-device="${id}" value="${esc(d.name)}"></label>`).join('')}`).join('')}<label class="field">Ritardo avviso sportello aperto (secondi)<input type="number" min="1" id="door-delay" value="${state.settings.doorDelay}"></label><button class="btn" onclick="saveSettings()">💾 SALVA MODIFICHE</button>`}function saveSettings(){if(!admin())return;for(const u of state.users){const v=$('name-'+u.id)?.value.trim();if(v)u.name=v}const g=$('guest-enabled');if(g)state.users.find(u=>u.id==='guest').enabled=g.checked;document.querySelectorAll('[data-device]').forEach(el=>{if(el.value.trim())dev(el.dataset.device).name=el.value.trim()});state.settings.doorDelay=Math.max(1,Number($('door-delay').value)||30);user=state.users.find(u=>u.id===user.id);event('Personalizzazione aggiornata da '+user.name);save();alert('Modifiche DEMO salvate in questo browser');render()}setInterval(()=>{if(user){sync();if(page==='home'||page==='alerts'||page==='zone')render()}},5000);render();
</script></body></html>
